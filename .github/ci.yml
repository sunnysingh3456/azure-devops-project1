name: Project -1 continoues integration
# trigger when github run this automation
on:
  pull_request:
   branches: [main] # only run when someone open/update PR targeting main

#3 JOBS: what work need to be performed
jobs:
  run_tests:
  # RUNNER request a clean and temporary VM from github cloud free pool
    runs_on: ubuntu-latest

    #STEPS - sequential commands executed inside the ubuntu VM
    steps:
     # step A: Download your repository code onto the virtual machine
      - name: Checkout code
        uses: actions/Checkout@v4

     # step B: Install Node.js runtime environment on the VM
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # step C: Install your project dependancies (fast & clean for cli)
      - name: install dependancies
        run: npm ci

      # step D: Execute your unit tests
      - name: Execute Automated tests
        run: npm test
