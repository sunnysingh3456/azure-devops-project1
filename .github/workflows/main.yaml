name: build, test and Deploy to azure staging

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: 'npm'

      - name: install dependencies
        run: npm ci

      - name: Run Unit tests
        run: npm test

  deploy-to-staging:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: install production dependencies only
        run: npm ci --only=production

      - name: deploy to azure web app (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-devops-staging-11485'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: .

      - name: verify staging web app health
        run: |
          echo "Waiting 25 seconds for Azure App Service to start..."
          sleep 25

          STAGING_URL="https://app-devops-staging-11485.azurewebsites.net"
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$STAGING_URL")
          echo "Azure Staging HTTP Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Health Check Passed! Staging Web app live hai."
          else
            echo "Health check failed! Status Code: $HTTP_STATUS"
            exit 1
          fi